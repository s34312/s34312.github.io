<!-- นี่คือโครงสร้างหน้าเว็บทังหมด -->
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>หน้าแนะนำตัวของฉัน</title>
  <style>
      body { 
          font-family: sans-serif; 
          margin: 0;
          padding: 50px 20px;
          text-align: center; 
          background-color: #0b0f19;
          position: relative;
          overflow-x: hidden;
          min-height: 100vh;
          box-sizing: border-box;
      }

      body::before {
          content: "";
          position: fixed;
          top: -10%;
          left: 0;
          width: 100%;
          height: 120%;
          z-index: -1;
          background-image: 
              linear-gradient(180deg, transparent 80%, rgba(17, 255, 0, 0.15) 90%, rgba(17, 255, 0, 0.4) 100%),
              linear-gradient(180deg, transparent 70%, rgba(0, 255, 204, 0.1) 85%, rgba(0, 255, 204, 0.3) 100%),
              linear-gradient(180deg, transparent 75%, rgba(255, 140, 0, 0.1) 85%, rgba(255, 140, 0, 0.3) 100%);
          background-size: 4px 300px, 6px 400px, 5px 250px;
          background-repeat: repeat-x;
          background-position: 10% 0%, 45% 50px, 80% 120px;
          animation: cyberRain 8s linear infinite;
      }

      @keyframes cyberRain {
          0% { background-position: 10% 0px, 45% 50px, 80% 120px; }
          100% { background-position: 10% 1200px, 45% 1250px, 80% 1320px; }
      }

      .card { 
          background: rgba(255, 255, 255, 0.85);
          backdrop-filter: blur(10px);
          border-radius: 40px; 
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3); 
          max-width: 500px; 
          margin: 0 auto; 
          padding: 40px 30px; 
          border: 1px solid rgba(255, 255, 255, 0.4);
      }

      .btn { 
          display: inline-block; 
          background: #FF8C00; 
          color: white; 
          padding: 12px 30px; 
          text-decoration: none; 
          border-radius: 12px; 
          margin-top: 30px; 
          font-weight: bold; 
          box-shadow: 0 4px 15px rgba(255, 140, 0, 0.4);
          transition: 0.3s; 
      }
      .btn:hover { 
          background: #e07b00; 
          transform: translateY(-3px);
          box-shadow: 0 6px 20px rgba(255, 140, 0, 0.6);
      } 
      .btn:visited { color: white; }
      h1 { color: #1a252f; margin-bottom: 25px; } 
      p { font-size: 18px; line-height: 1.6; color: #333; }

      .neon-box {
          position: relative;
          width: 200px;
          height: 200px;
          margin: 20px auto;
          border-radius: 50% !important;
          overflow: hidden;
          display: flex;
          justify-content: center;
          align-items: center;
          box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
      }

      .neon-box::before {
          content: '';
          position: absolute;
          width: 150%;
          height: 150%;
          background: conic-gradient(#ff0055, #00ffcc, #9900ff, #ff0055);
          animation: rotateRGB 4s linear infinite;
      }

      .neon-box::after {
          content: '';
          position: absolute;
          inset: 5px;
          background: white;
          border-radius: 50% !important;
          z-index: 1;
      }

      .profile-effect {
          width: calc(100% - 10px);
          height: calc(100% - 10px);
          border-radius: 50% !important;
          object-fit: cover;
          z-index: 2;
          transition: transform 0.3s ease;
      }

      .neon-box:hover .profile-effect {
          transform: scale(1.08) rotate(5deg);
      }

      @keyframes rotateRGB {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
      }
  </style>
</head>
<body>
  <div class="card">
      <h1>ยินดีต้อนรับสู่โปรไฟล์ของฉัน </h1>

      <div class="neon-box">
        <img src="113596.jpg" class="profile-effect" alt="Profile">
      </div>

      <p>สวัสดีครับ! ผมชื่อ <strong>อิทธิพัทธ์ แจ่มจำรัส (Itthipat Jamjumras)</strong> ชั้น ม.6/3 เลขที่ 7</p>
      <p>ขณะนี้กำลังศึกษาอยู่สายการเรียน MSEP สนใจด้านรัฐศาสตร์และนิติศาสตร์</p>
      <p>นี่คือเว็บไซต์แรกของผมที่โฮสต์บน GitHub Pages!</p>
  </div>
</body>

<body>
   <div class=".btn">
        <a href="portfolio.html" class="btn"> หน้าแสดง Portfolio</a>
   </div>
</body>
</html>
