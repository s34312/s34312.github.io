<!-- นี่คือโครงสร้างหน้าเว็บทังหมด -->
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>หน้าแนะนำตัวของฉัน</title>
  <style>
      body {
         font-family: sans-serif;
         background-color: #11FF00; 
         color: #333;
         text-align: center; 
         padding: 50px;
      }
      .card {
          background: white; 
          border-radius: 50px;
          box-shadow: 0 4px 8px rgba(0,0,0,0.1);
          max-width: 500px; 
          margin: 0 auto; 
          padding: 30px;
      }
      .btn { 
          display: inline-block; 
          background: #FF8C00; 
          color: white; 
          padding: 10px 20px; 
          text-decoration: none; 
          border-radius: 10px; 
          margin-top: 20px; 
          font-weight: bold;
          transition: 0.3s;
      }
      .btn:hover {
          background: #e07b00;
      }
      .btn:visited {
          color: white;
      }
      h1 { color: #2c3e50; }
      p { font-size: 18px; line-height: 1.6; }

      .img-animation-container {
          position: relative;
          width: 200px;
          height: 200px;
          margin: 20px auto;
          display: flex;
          justify-content: center;
          align-items: center;
      }

      .img-animation-container::before,
      .img-animation-container::after {
          content: "";
          position: absolute;
          width: 100%;
          height: 100%;
          border-radius: 50% !important;
          border: 4px solid #FF8C00;
          box-shadow: 0 0 15px rgba(255, 140, 0, 0.6);
          animation: pulse 2s infinite ease-out;
          opacity: 0;
      }

      .img-animation-container::after {
          animation-delay: 1s;
      }

      .profile-effect {
          width: 200px;
          height: 200px;
          border-radius: 50% !important;
          object-fit: cover;
          border: 5px solid #11FF00;
          box-shadow: 0 4px 10px rgba(0,0,0,0.15);
          z-index: 2;
          transition: transform 0.3s ease-in-out;
      }

      .profile-effect:hover {
          transform: scale(1.08);
          cursor: pointer;
      }

      @keyframes pulse {
          0% {
              transform: scale(0.95);
              opacity: 0.8;
          }
          100% {
              transform: scale(1.25);
              opacity: 0;
          }
      }
  </style>
</head>
<body>
  <div class="card">
      <h1>ยินดีต้อนรับสู่โปรไฟล์ของฉัน </h1>

      <div class="img-animation-container">
        <img src="113596.jpg" class="profile-effect" alt="Profile">
      </div>

      <p>สวัสดีครับ! ผมชื่อ <strong>อิทธิพัทธ์ แจ่มจำรัส (Itthipat Jamjumras)</strong> ชั้น ม.6/3 เลขที่ 7</p>
      <p>ขณะนี้กำลังศึกษาอยู่สายการเรียน MSEP สนใจด้านรัฐศาสตร์และนิติศาสตร์</p>
      <p>นี่คือเว็บไซต์แรกของผมที่โฮสต์บน GitHub Pages!</p>
  </div>
</body>

<body>
   <div class=".btn">
        <a href="portfolio.html" class="btn"> หน้าแสดง Portfolio</a>
   </div>
</body>
</html>
