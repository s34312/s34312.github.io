<!-- นี่คือโครงสร้างหน้าเว็บทังหมด -->
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>หน้าแนะนำตัวของฉัน</title>
  <style>
      body { 
          font-family: sans-serif; 
          margin: 0;
          padding: 60px 20px;
          text-align: center; 
          background-color: #03050a;
          position: relative;
          overflow-x: hidden;
          min-height: 100vh;
          box-sizing: border-box;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
      }

      body::before {
          content: "";
          position: fixed;
          top: -50%;
          left: -50%;
          width: 200%;
          height: 200%;
          z-index: -1;
          background: 
              radially-gradient(circle at center, transparent 30%, #03050a 70%),
              conic-gradient(from 0deg, transparent, rgba(0, 255, 204, 0.3) 15%, transparent 30%, rgba(255, 0, 85, 0.2) 50%, transparent 70%, rgba(17, 255, 0, 0.2) 85%, transparent);
          animation: vortexRotateRight 15s linear infinite;
          filter: blur(10px);
      }

      body::after {
          content: "";
          position: fixed;
          top: -50%;
          left: -50%;
          width: 200%;
          height: 200%;
          z-index: -1;
          background-image: 
              linear-gradient(rgba(0, 255, 204, 0.04) 1px, transparent 1px),
              linear-gradient(90deg, rgba(0, 255, 204, 0.04) 1px, transparent 1px);
          background-size: 50px 50px;
          background-position: center;
          mask-image: radial-gradient(circle at center, transparent 10%, black 80%);
          -webkit-mask-image: radial-gradient(circle at center, transparent 10%, black 80%);
          animation: vortexRotateLeft 25s linear infinite;
      }

      @keyframes vortexRotateRight {
          0% { transform: rotate(0deg) scale(1); }
          50% { transform: rotate(180deg) scale(1.1); }
          100% { transform: rotate(360deg) scale(1); }
      }

      @keyframes vortexRotateLeft {
          0% { transform: rotate(360deg); }
          100% { transform: rotate(0deg); }
      }

      .card { 
          background: rgba(7, 11, 22, 0.75); 
          backdrop-filter: blur(12px); 
          -webkit-backdrop-filter: blur(12px);
          border-radius: 40px; 
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(0, 255, 204, 0.1); 
          max-width: 500px; 
          width: 100%;
          padding: 40px 30px; 
          border: 1px solid rgba(0, 255, 204, 0.25);
          box-sizing: border-box;
      }

      h1 { 
          color: #fff; 
          margin-top: 0;
          margin-bottom: 25px; 
          font-size: 28px;
          text-shadow: 0 0 10px rgba(0, 255, 204, 0.6), 0 0 20px rgba(0, 255, 204, 0.2);
      } 
      p { 
          font-size: 18px; 
          line-height: 1.6; 
          color: #cbd5e1; 
      }
      strong {
          color: #00ffcc;
          text-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
      }

      .btn { 
          display: inline-block; 
          background: transparent;
          color: #ff8c00; 
          padding: 12px 35px; 
          text-decoration: none; 
          border-radius: 14px; 
          margin-top: 30px; 
          font-weight: bold; 
          font-size: 16px;
          border: 2px solid #ff8c00;
          box-shadow: 0 0 15px rgba(255, 140, 0, 0.2);
          transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
      }
      .btn:hover { 
          background: #ff8c00; 
          color: #03050a;
          transform: translateY(-4px) scale(1.03);
          box-shadow: 0 0 30px rgba(255, 140, 0, 0.6);
      } 
      .btn:visited { color: #ff8c00; }
      .btn:hover:visited { color: #03050a; }

      .neon-box {
          position: relative;
          width: 200px;
          height: 200px;
          margin: 20px auto;
          border-radius: 50% !important;
          overflow: hidden;
          display: flex;
          justify-content: center;
          align-items: center;
          box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
      }

      .neon-box::before {
          content: '';
          position: absolute;
          width: 150%;
          height: 150%;
          background: conic-gradient(#ff0055, #00ffcc, #9900ff, #ff0055);
          animation: rotateRGB 4s linear infinite;
      }

      .neon-box::after {
          content: '';
          position: absolute;
          inset: 5px;
          background: white;
          border-radius: 50% !important;
          z-index: 1;
      }

      .profile-effect {
          width: calc(100% - 10px);
          height: calc(100% - 10px);
          border-radius: 50% !important;
          object-fit: cover;
          z-index: 2;
          transition: transform 0.3s ease;
      }

      .neon-box:hover .profile-effect {
          transform: scale(1.08) rotate(5deg);
      }

      @keyframes rotateRGB {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
      }
  </style>
</head>
<body>
  <div class="card">
      <h1>ยินดีต้อนรับสู่โปรไฟล์ของฉัน </h1>

      <div class="neon-box">
        <img src="113596.jpg" class="profile-effect" alt="Profile">
      </div>

      <p>สวัสดีครับ! ผมชื่อ <strong>อิทธิพัทธ์ แจ่มจำรัส (Itthipat Jamjumras)</strong> ชั้น ม.6/3 เลขที่ 7</p>
      <p>ขณะนี้กำลังศึกษาอยู่สายการเรียน MSEP สนใจด้านรัฐศาสตร์และนิติศาสตร์</p>
      <p>นี่คือเว็บไซต์แรกของผมที่โฮสต์บน GitHub Pages!</p>
  </div>
</body>

<body>
   <div class=".btn">
        <a href="portfolio.html" class="btn"> หน้าแสดง Portfolio</a>
   </div>
</body>
</html>
