<!-- นี่คือโครงสร้างหน้าเว็บทังหมด -->
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>หน้าแนะนำตัวของฉัน</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: sans-serif;
      padding: 60px 20px;
      text-align: center;
      background: #02030a;
      color: white;
      overflow-x: hidden;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      position: relative;
    }

    .space {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: -10;
      background:
        radial-gradient(
          circle at 50% 50%,
          rgba(0, 255, 204, 0.08),
          transparent 30%
        ),
        radial-gradient(
          circle at 20% 20%,
          rgba(140, 0, 255, 0.12),
          transparent 35%
        ),
        radial-gradient(
          circle at 80% 80%,
          rgba(255, 0, 120, 0.10),
          transparent 35%
        ),
        #02030a;
    }

    .aurora {
      position: absolute;
      width: 120vw;
      height: 120vh;

      left: -10vw;
      top: -10vh;

      background:
        conic-gradient(
          from 0deg,
          transparent,
          rgba(0, 255, 204, 0.10),
          transparent 20%,
          rgba(120, 0, 255, 0.12),
          transparent 40%,
          rgba(255, 0, 100, 0.10),
          transparent 60%,
          rgba(0, 180, 255, 0.10),
          transparent
        );

      filter: blur(70px);

      animation:
        auroraRotate 25s linear infinite,
        auroraPulse 7s ease-in-out infinite alternate;
    }

    @keyframes auroraRotate {
      from {
        transform: rotate(0deg) scale(1);
      }

      to {
        transform: rotate(360deg) scale(1.2);
      }
    }

    @keyframes auroraPulse {
      from {
        opacity: 0.45;
      }

      to {
        opacity: 0.9;
      }
    }

    .energy-ring {
      position: absolute;
      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      border-radius: 50%;

      border: 1px solid rgba(0, 255, 204, 0.12);

      box-shadow:
        0 0 20px rgba(0, 255, 204, 0.05),
        inset 0 0 20px rgba(140, 0, 255, 0.04);

      animation: ringSpin linear infinite;
    }

    .ring1 {
      width: 350px;
      height: 350px;
      animation-duration: 14s;
    }

    .ring2 {
      width: 650px;
      height: 650px;
      border-color: rgba(160, 0, 255, 0.10);
      animation-duration: 22s;
      animation-direction: reverse;
    }

    .ring3 {
      width: 1000px;
      height: 1000px;
      border-color: rgba(255, 0, 120, 0.07);
      animation-duration: 35s;
    }

    @keyframes ringSpin {
      from {
        transform:
          translate(-50%, -50%)
          rotate(0deg)
          scaleX(1);
      }

      50% {
        transform:
          translate(-50%, -50%)
          rotate(180deg)
          scaleX(0.65);
      }

      to {
        transform:
          translate(-50%, -50%)
          rotate(360deg)
          scaleX(1);
      }
    }

    .particles {
      position: absolute;
      inset: 0;
    }

    .particle {
      position: absolute;

      width: 3px;
      height: 3px;

      border-radius: 50%;

      background: #00ffcc;

      box-shadow:
        0 0 8px #00ffcc,
        0 0 20px #00ffcc;

      animation:
        particleFloat var(--duration) linear infinite,
        particleBlink 2s ease-in-out infinite alternate;
    }

    .particle:nth-child(3n) {
      background: #9900ff;

      box-shadow:
        0 0 8px #9900ff,
        0 0 20px #9900ff;
    }

    .particle:nth-child(4n) {
      background: #ff0077;

      box-shadow:
        0 0 8px #ff0077,
        0 0 20px #ff0077;
    }

    @keyframes particleFloat {
      from {
        transform:
          translateY(110vh)
          translateX(0)
          scale(0.3);
      }

      to {
        transform:
          translateY(-20vh)
          translateX(var(--move))
          scale(1.3);
      }
    }

    @keyframes particleBlink {
      from {
        opacity: 0.25;
      }

      to {
        opacity: 1;
      }
    }

    .neural {
      position: absolute;
      inset: 0;
      opacity: 0.35;
      filter: blur(0.3px);
    }

    .neural::before,
    .neural::after {
      content: "";

      position: absolute;

      width: 150%;
      height: 2px;

      left: -25%;
      top: 50%;

      background:
        linear-gradient(
          90deg,
          transparent,
          #00ffcc,
          #9900ff,
          #ff0077,
          transparent
        );

      filter:
        drop-shadow(0 0 8px #00ffcc)
        drop-shadow(0 0 15px #9900ff);

      animation: neuralMove 8s ease-in-out infinite alternate;
    }

    .neural::after {
      top: 60%;
      animation-delay: -3s;
      opacity: 0.6;
    }

    @keyframes neuralMove {
      from {
        transform:
          rotate(-12deg)
          translateY(-100px)
          scaleX(0.8);
      }

      to {
        transform:
          rotate(15deg)
          translateY(100px)
          scaleX(1.2);
      }
    }

    .mouse-glow {
      position: fixed;

      width: 350px;
      height: 350px;

      border-radius: 50%;

      pointer-events: none;

      background:
        radial-gradient(
          circle,
          rgba(0, 255, 204, 0.10),
          rgba(130, 0, 255, 0.04) 35%,
          transparent 70%
        );

      transform: translate(-50%, -50%);

      filter: blur(15px);

      z-index: -1;

      transition:
        left 0.15s ease,
        top 0.15s ease;
    }

    .card {
      position: relative;

      background:
        linear-gradient(
          135deg,
          rgba(10, 15, 30, 0.82),
          rgba(5, 8, 18, 0.65)
        );

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-radius: 40px;

      max-width: 500px;
      width: 100%;

      padding: 40px 30px;

      border:
        1px solid rgba(0, 255, 204, 0.25);

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.7),
        0 0 50px rgba(0, 255, 204, 0.08);

      overflow: hidden;
    }

    .card::before {
      content: "";

      position: absolute;

      inset: -2px;

      border-radius: 42px;

      background:
        conic-gradient(
          from 0deg,
          transparent 0deg,
          #00ffcc 70deg,
          transparent 120deg,
          #9900ff 200deg,
          transparent 260deg,
          #ff0077 320deg,
          transparent 360deg
        );

      animation: cardBorder 5s linear infinite;

      z-index: -1;
      opacity: 0.7;
    }

    .card::after {
      content: "";

      position: absolute;

      inset: 1px;

      border-radius: 39px;

      background: rgba(5, 8, 18, 0.88);

      z-index: -1;
    }

    @keyframes cardBorder {
      to {
        transform: rotate(360deg);
      }
    }

      .neon-box {
          position: relative;
          width: 200px;
          height: 200px;
          margin: 20px auto;
          border-radius: 50% !important;
          overflow: hidden;
          display: flex;
          justify-content: center;
          align-items: center;
          box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
      }

      .neon-box::before {
          content: '';
          position: absolute;
          width: 150%;
          height: 150%;
          background: conic-gradient(#ff0055, #00ffcc, #9900ff, #ff0055);
          animation: rotateRGB 4s linear infinite;
      }

      .neon-box::after {
          content: '';
          position: absolute;
          inset: 5px;
          background: white;
          border-radius: 50% !important;
          z-index: 1;
      }

      .profile-effect {
          width: calc(100% - 10px);
          height: calc(100% - 10px);
          border-radius: 50% !important;
          object-fit: cover;
          z-index: 2;
          transition: transform 0.3s ease;
      }

      .neon-box:hover .profile-effect {
          transform: scale(1.08) rotate(5deg);
      }

      @keyframes rotateRGB {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
      }
  </style>
</head>
<body>
  <div class="card">
      <h1>ยินดีต้อนรับสู่โปรไฟล์ของฉัน </h1>

      <div class="neon-box">
        <img src="113596.jpg" class="profile-effect" alt="Profile">
      </div>

      <p>สวัสดีครับ! ผมชื่อ <strong>อิทธิพัทธ์ แจ่มจำรัส (Itthipat Jamjumras)</strong> ชั้น ม.6/3 เลขที่ 7</p>
      <p>ขณะนี้กำลังศึกษาอยู่สายการเรียน MSEP สนใจด้านรัฐศาสตร์และนิติศาสตร์</p>
      <p>นี่คือเว็บไซต์แรกของผมที่โฮสต์บน GitHub Pages!</p>
  </div>
</body>
