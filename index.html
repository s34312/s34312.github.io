<!-- นี่คือโครงสร้างหน้าเว็บทังหมด -->
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>หน้าแนะนำตัวของฉัน</title>
  <style>
      body { font-family: sans-serif; background-color: #11FF00; color: #333; text-align: center; padding: 50px; }
      .card { background: white; border-radius: 50px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; padding: 30px; }
      .btn { display: inline-block; background: #FF8C00; color: white; padding: 10px 20px; text-decoration: none; border-radius: 10px; margin-top: 20px; font-weight: bold; transition: 0.3s; }
      .btn:hover { background: #e07b00; } .btn:visited { color: white; }
      h1 { color: #2c3e50; } p { font-size: 18px; line-height: 1.6; }

      .neon-box {
          position: relative;
          width: 200px;
          height: 200px;
          margin: 20px auto;
          border-radius: 50% !important;
          overflow: hidden;
          display: flex;
          justify-content: center;
          align-items: center;
          box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
      }

      .neon-box::before {
          content: '';
          position: absolute;
          width: 150%;
          height: 150%;
          background: conic-gradient(#ff0055, #00ffcc, #9900ff, #ff0055);
          animation: rotateRGB 4s linear infinite;
      }

      .neon-box::after {
          content: '';
          position: absolute;
          inset: 5px;
          background: white;
          border-radius: 50% !important;
          z-index: 1;
      }

      .profile-effect {
          width: calc(100% - 10px);
          height: calc(100% - 10px);
          border-radius: 50% !important;
          object-fit: cover;
          z-index: 2;
          transition: transform 0.3s ease;
      }

      .neon-box:hover .profile-effect {
          transform: scale(1.08) rotate(5deg);
      }

      @keyframes rotateRGB {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
      }
  </style>
</head>
<body>
  <div class="card">
      <h1>ยินดีต้อนรับสู่โปรไฟล์ของฉัน </h1>

      <div class="neon-box">
        <img src="113596.jpg" class="profile-effect" alt="Profile">
      </div>

      <p>สวัสดีครับ! ผมชื่อ <strong>อิทธิพัทธ์ แจ่มจำรัส (Itthipat Jamjumras)</strong> ชั้น ม.6/3 เลขที่ 7</p>
      <p>ขณะนี้กำลังศึกษาอยู่สายการเรียน MSEP สนใจด้านรัฐศาสตร์และนิติศาสตร์</p>
      <p>นี่คือเว็บไซต์แรกของผมที่โฮสต์บน GitHub Pages!</p>
  </div>
</body>

<body>
   <div class=".btn">
        <a href="portfolio.html" class="btn"> หน้าแสดง Portfolio</a>
   </div>
</body>
</html>
