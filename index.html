<!-- นี่คือโครงสร้างหน้าเว็บทังหมด -->
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>หน้าแนะนำตัวของฉัน</title>
  <style>
      body { 
          font-family: sans-serif; 
          margin: 0;
          padding: 60px 20px;
          text-align: center; 
          background-color: #020208;
          position: relative;
          overflow-x: hidden;
          min-height: 100vh;
          box-sizing: border-box;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
      }

      .space-nebula {
          position: fixed;
          inset: 0;
          z-index: -4;
          background: 
              radial-gradient(circle at 10% 20%, rgba(122, 0, 255, 0.15) 0%, transparent 45%),
              radial-gradient(circle at 90% 80%, rgba(0, 162, 255, 0.12) 0%, transparent 45%),
              radial-gradient(circle at 50% 50%, rgba(17, 255, 0, 0.08) 0%, transparent 50%);
          filter: blur(50px);
          animation: nebulaShift 16s ease-in-out infinite alternate;
      }

      .space-stars {
          position: fixed;
          inset: 0;
          z-index: -3;
          background-image: 
              radial-gradient(circle, #fff 1px, transparent 1px),
              radial-gradient(circle, rgba(255,255,255,0.7) 1.5px, transparent 1.5px);
          background-size: 150px 150px, 200px 200px;
          background-position: 0 0, 70px 110px;
          animation: starTwinkle 4s ease-in-out infinite alternate;
      }

      .space-warp {
          position: fixed;
          inset: -50%;
          width: 200%;
          height: 200%;
          z-index: -2;
          background-image: 
              radial-gradient(ellipse at center, rgba(0, 255, 204, 0.08) 1px, transparent 3px),
              radial-gradient(ellipse at center, rgba(255, 0, 85, 0.05) 1px, transparent 4px);
          background-size: 80px 80px, 120px 120px;
          background-position: center;
          transform: scale(0.5);
          animation: warpSpeed 6s linear infinite;
          mask-image: radial-gradient(circle at center, transparent 20%, black 80%);
          -webkit-mask-image: radial-gradient(circle at center, transparent 20%, black 80%);
      }

      .space-horizon {
          position: fixed;
          inset: 0;
          z-index: -1;
          background: linear-gradient(to bottom, transparent, rgba(0, 255, 204, 0.03) 50%, transparent);
          background-size: 100% 200%;
          animation: horizonScan 8s linear infinite;
      }

      @keyframes nebulaShift {
          0% { transform: scale(1) translate(0px, 0px) rotate(0deg); }
          100% { transform: scale(1.2) translate(-30px, 20px) rotate(15deg); }
      }

      @keyframes starTwinkle {
          0% { opacity: 0.3; }
          100% { opacity: 1; }
      }

      @keyframes warpSpeed {
          0% { transform: scale(0.6) rotate(0deg); opacity: 0; }
          10% { opacity: 1; }
          90% { opacity: 1; }
          100% { transform: scale(1.4) rotate(15deg); opacity: 0; }
      }

      @keyframes horizonScan {
          0% { background-position: 0% 0%; }
          100% { background-position: 0% 200%; }
      }

      .card { 
          background: rgba(5, 5, 15, 0.7);
          backdrop-filter: blur(15px); 
          -webkit-backdrop-filter: blur(15px);
          border-radius: 40px; 
          box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 50px rgba(122, 0, 255, 0.15); 
          max-width: 500px; 
          width: 100%;
          padding: 45px 35px; 
          border: 1px solid rgba(255, 255, 255, 0.15);
          position: relative;
          z-index: 10;
          box-sizing: border-box;
      }

      h1 { 
          color: #fff; 
          margin-top: 0;
          margin-bottom: 25px; 
          font-size: 28px;
          letter-spacing: 1px;
          text-shadow: 0 0 10px rgba(255, 255, 255, 0.6), 0 0 20px rgba(0, 162, 255, 0.4);
      } 
      p { 
          font-size: 18px; 
          line-height: 1.6; 
          color: #cbd5e1; 
      }
      strong {
          color: #00ffcc;
          text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
      }

      .btn { 
          display: inline-block; 
          background: transparent;
          color: #ff8c00; 
          padding: 14px 40px; 
          text-decoration: none; 
          border-radius: 16px; 
          margin-top: 35px; 
          font-weight: bold; 
          font-size: 16px;
          border: 2px solid #ff8c00;
          box-shadow: 0 0 15px rgba(255, 140, 0, 0.2);
          transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
          z-index: 10;
          position: relative;
      }
      .btn:hover { 
          background: #ff8c00; 
          color: #020208;
          transform: translateY(-4px);
          box-shadow: 0 0 35px rgba(255, 140, 0, 0.7);
      } 
      .btn:visited { color: #ff8c00; }
      .btn:hover:visited { color: #020208; }

      .neon-box {
          position: relative;
          width: 200px;
          height: 200px;
          margin: 25px auto;
          border-radius: 50% !important;
          overflow: hidden; 
          display: flex;
          justify-content: center;
          align-items: center;
          box-shadow: 0 0 30px rgba(0, 162, 255, 0.4);
      }

      .neon-box::before {
          content: '';
          position: absolute;
          width: 150%;
          height: 150%;
          background: conic-gradient(#ff0055, #00ffcc, #9900ff, #ff0055);
          animation: rotateRGB 3s linear infinite; 
      }

      .neon-box::after {
          content: '';
          position: absolute;
          inset: 5px; 
          background: #05050f;
          border-radius: 50% !important;
          z-index: 1;
      }

      .profile-effect {
          width: calc(100% - 10px);
          height: calc(100% - 10px);
          border-radius: 50% !important;
          object-fit: cover;
          z-index: 2; 
          transition: transform 0.3s ease;
      }

      .neon-box:hover .profile-effect {
          transform: scale(1.08) rotate(5deg); 
      }

      @keyframes rotateRGB {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
      }
  </style>
</head>
<body>

    <div class="space-nebula"></div>
  <div class="space-stars"></div>
  <div class="space-warp"></div>
  <div class="space-horizon"></div>

  <div class="card">
      <h1>ยินดีต้อนรับสู่โปรไฟล์ของฉัน </h1>

      <div class="neon-box">
        <img src="113596.jpg" class="profile-effect" alt="Profile">
      </div>

      <p>สวัสดีครับ! ผมชื่อ <strong>อิทธิพัทธ์ แจ่มจำรัส (Itthipat Jamjumras)</strong> ชั้น ม.6/3 เลขที่ 7</p>
      <p>ขณะนี้กำลังศึกษาอยู่สายการเรียน MSEP สนใจด้านรัฐศาสตร์และนิติศาสตร์</p>
      <p>นี่คือเว็บไซต์แรกของผมที่โฮสต์บน GitHub Pages!</p>
  </div>
</body>

<body>
   <div class=".btn">
        <a href="portfolio.html" class="btn"> หน้าแสดง Portfolio</a>
   </div>
</body>
</html>
