<!-- นี่คือโครงสร้างหน้าเว็บทังหมด -->
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>หน้าแนะนำตัวของฉัน</title>
  <style>
      body { 
          font-family: sans-serif; 
          margin: 0;
          padding: 60px 20px;
          text-align: center; 
          background-color: #050811;
          position: relative;
          overflow-x: hidden;
          min-height: 100vh;
          box-sizing: border-box;
          
          background-image: 
              linear-gradient(rgba(17, 255, 0, 0.05) 1px, transparent 1px),
              linear-gradient(90deg, rgba(17, 255, 0, 0.05) 1px, transparent 1px);
          background-size: 30px 30px;
          background-position: center;
      }

      body::before {
          content: "";
          position: fixed;
          inset: 0;
          z-index: -1;
          background-image: 
              radial-gradient(circle, #00ffcc 2px, transparent 2px),
              radial-gradient(circle, #ff0055 2px, transparent 2px),
              radial-gradient(circle, #11FF00 3px, transparent 3px);
          background-size: 80px 160px, 120px 200px, 150px 300px;
          background-position: 0px 0px, 40px 60px, 10px 100px;
          animation: particleUp 12s linear infinite;
      }

      @keyframes particleUp {
          0% { background-position: 0px 0px, 40px 60px, 10px 100px; }
          100% { background-position: 0px -960px, 40px -1000px, 10px -900px; }
      }

      .card { 
          background: rgba(10, 16, 32, 0.75);
          backdrop-filter: blur(15px);
          -webkit-backdrop-filter: blur(15px);
          border-radius: 30px;
          box-shadow: 0 0 30px rgba(17, 255, 0, 0.2), inset 0 0 15px rgba(255,255,255,0.05); 
          max-width: 500px; 
          margin: 0 auto; 
          padding: 40px 30px;
          border: 2px solid rgba(0, 255, 136, 0.4);
          position: relative;
      }

      h1 { 
          color: #fff; 
          margin-bottom: 25px; 
          text-shadow: 0 0 10px rgba(0, 255, 204, 0.8), 0 0 20px rgba(0, 255, 204, 0.4);
      } 
      p { 
          font-size: 18px; 
          line-height: 1.6; 
          color: #cbd5e1;
      }
      strong {
          color: #00ffcc;
          text-shadow: 0 0 5px rgba(0, 255, 204, 0.5);
      }

      .btn { 
          display: inline-block; 
          background: transparent;
          color: #ff8c00; 
          padding: 12px 30px; 
          text-decoration: none; 
          border-radius: 12px; 
          margin-top: 30px; 
          font-weight: bold; 
          border: 2px solid #ff8c00;
          text-shadow: 0 0 5px rgba(255, 140, 0, 0.5);
          box-shadow: 0 0 15px rgba(255, 140, 0, 0.2), inset 0 0 10px rgba(255, 140, 0, 0.1);
          transition: all 0.3s ease; 
      }
      .btn:hover { 
          background: #ff8c00; 
          color: #050811;
          transform: translateY(-3px);
          box-shadow: 0 0 25px rgba(255, 140, 0, 0.6);
          text-shadow: none;
      } 
      .btn:visited { color: #ff8c00; }
      .btn:hover:visited { color: #050811; }

      .neon-box {
          position: relative;
          width: 200px;
          height: 200px;
          margin: 20px auto;
          border-radius: 50% !important;
          overflow: hidden;
          display: flex;
          justify-content: center;
          align-items: center;
          box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
      }

      .neon-box::before {
          content: '';
          position: absolute;
          width: 150%;
          height: 150%;
          background: conic-gradient(#ff0055, #00ffcc, #9900ff, #ff0055);
          animation: rotateRGB 4s linear infinite;
      }

      .neon-box::after {
          content: '';
          position: absolute;
          inset: 5px;
          background: white;
          border-radius: 50% !important;
          z-index: 1;
      }

      .profile-effect {
          width: calc(100% - 10px);
          height: calc(100% - 10px);
          border-radius: 50% !important;
          object-fit: cover;
          z-index: 2;
          transition: transform 0.3s ease;
      }

      .neon-box:hover .profile-effect {
          transform: scale(1.08) rotate(5deg);
      }

      @keyframes rotateRGB {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
      }
  </style>
</head>
<body>
  <div class="card">
      <h1>ยินดีต้อนรับสู่โปรไฟล์ของฉัน </h1>

      <div class="neon-box">
        <img src="113596.jpg" class="profile-effect" alt="Profile">
      </div>

      <p>สวัสดีครับ! ผมชื่อ <strong>อิทธิพัทธ์ แจ่มจำรัส (Itthipat Jamjumras)</strong> ชั้น ม.6/3 เลขที่ 7</p>
      <p>ขณะนี้กำลังศึกษาอยู่สายการเรียน MSEP สนใจด้านรัฐศาสตร์และนิติศาสตร์</p>
      <p>นี่คือเว็บไซต์แรกของผมที่โฮสต์บน GitHub Pages!</p>
  </div>
</body>

<body>
   <div class=".btn">
        <a href="portfolio.html" class="btn"> หน้าแสดง Portfolio</a>
   </div>
</body>
</html>
