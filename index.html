<!-- นี่คือโครงสร้างหน้าเว็บทังหมด -->
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>หน้าแนะนำตัวของฉัน</title>
  <style>
      body { 
          font-family: sans-serif; 
          margin: 0;
          padding: 60px 20px;
          text-align: center; 
          background-color: #010206; 
          position: relative;
          overflow-x: hidden;
          min-height: 100vh;
          box-sizing: border-box;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
      }

      .space-aurora {
          position: fixed;
          inset: 0;
          z-index: -6;
          background: 
              radial-gradient(circle at 10% 20%, rgba(122, 0, 255, 0.15) 0%, transparent 50%),
              radial-gradient(circle at 80% 60%, rgba(0, 255, 204, 0.12) 0%, transparent 45%),
              radial-gradient(circle at 40% 80%, rgba(255, 0, 110, 0.08) 0%, transparent 40%);
          filter: blur(60px);
          animation: auroraShift 20s ease-in-out infinite alternate;
      }

      .giant-planet-container {
          position: fixed;
          top: -20px;
          right: -50px;
          width: 280px;
          height: 280px;
          z-index: -5;
          display: flex;
          justify-content: center;
          align-items: center;
          transform: rotate(-15deg);
          animation: planetFloat 8s ease-in-out infinite alternate;
          pointer-events: none;
      }

      .planet-body {
          position: absolute;
          width: 140px;
          height: 140px;
          border-radius: 50%;
          background: radial-gradient(circle at 30% 30%, #00ffcc 0%, #053a47 60%, #01040a 100%);
          box-shadow: 0 0 40px rgba(0, 255, 204, 0.4), inset -10px -10px 30px rgba(0,0,0,0.8);
          z-index: 2;
      }

      .planet-ring {
          position: absolute;
          width: 260px;
          height: 40px;
          border: 12px solid #ff0066;
          border-radius: 50%;
          transform: rotate(-20deg);
          box-shadow: 0 0 25px rgba(255, 0, 102, 0.6), inset 0 0 25px rgba(255, 0, 102, 0.6);
          z-index: 3;
      }

      .planet-ring-back-shadow {
          position: absolute;
          width: 260px;
          height: 40px;
          border: 12px solid #ff0066;
          border-radius: 50%;
          transform: rotate(-20deg);
          z-index: 1;
      }


      .planet-ring-back-shadow {
          position: absolute;
          width: 260px;
          height: 40px;
          border: 12px solid #ff0066;
          border-radius: 50%;
          transform: rotate(-20deg);
          z-index: 1; 
      }

      .solar-system-container {
          position: fixed;
          bottom: 20px;
          left: 20px;
          width: 240px;
          height: 240px;
          z-index: -5;
          display: flex;
          justify-content: center;
          align-items: center;
          pointer-events: none;
          transform: perspective(600px) rotateX(45deg);
      }

      .solar-system-container {
          position: fixed;
          bottom: 20px;
          left: 20px;
          width: 240px;
          height: 240px;
          z-index: -5;
          display: flex;
          justify-content: center;
          align-items: center;
          pointer-events: none;
          transform: perspective(600px) rotateX(45deg); 
      }

      .solar-sun {
          position: absolute;
          width: 30px;
          height: 30px;
          background: radial-gradient(circle, #fff 0%, #ff8c00 60%, #ff3300 100%);
          border-radius: 50%;
          box-shadow: 0 0 25px #ff8c00, 0 0 40px rgba(255, 140, 0, 0.6);
          z-index: 5;
      }

      .orbit-1 {
          position: absolute;
          width: 90px;
          height: 90px;
          border: 1px dashed rgba(255, 255, 255, 0.15);
          border-radius: 50%;
          animation: orbitRotate 5s linear infinite;
      }
      .planet-1 {
          position: absolute;
          top: -5px;
          left: calc(50% - 5px);
          width: 10px;
          height: 10px;
          background-color: #ff0066;
          border-radius: 50%;
          box-shadow: 0 0 10px #ff0066;
      }

      .orbit-2 {
          position: absolute;
          width: 150px;
          height: 150px;
          border: 1px dashed rgba(255, 255, 255, 0.15);
          border-radius: 50%;
          animation: orbitRotate 9s linear infinite;
      }
      .planet-2 {
          position: absolute;
          top: -7px;
          left: calc(50% - 7px);
          width: 14px;
          height: 14px;
          background-color: #11FF00;
          border-radius: 50%;
          box-shadow: 0 0 12px #11FF00;
      }

      .orbit-3 {
          position: absolute;
          width: 210px;
          height: 210px;
          border: 1px dashed rgba(255, 255, 255, 0.15);
          border-radius: 50%;
          animation: orbitRotate 14s linear infinite;
      }
      .planet-3 {
          position: absolute;
          top: -6px;
          left: calc(50% - 6px);
          width: 12px;
          height: 12px;
          background-color: #00ffcc;
          border-radius: 50%;
          box-shadow: 0 0 12px #00ffcc;
      }

      .star {
          position: absolute;
          background-color: #ffffff;
          border-radius: 50%;
          animation: twinkle var(--duration) ease-in-out infinite alternate;
          opacity: var(--base-opacity);
      }

      .space-dust {
          position: fixed;
          inset: -10%;
          z-index: -3;
          background-image: 
              radial-gradient(rgba(255, 255, 255, 0.1) 2px, transparent 2px),
              radial-gradient(rgba(0, 255, 204, 0.08) 3px, transparent 3px);
          background-size: 260px 260px, 340px 340px;
          background-position: 10px 20px, 150px 70px;
          animation: dustFloat 25s linear infinite;
      }

      .shooting-star-container {
          position: fixed;
          inset: 0;
          z-index: -2;
          pointer-events: none;
      }
      .shooting-star {
          position: absolute;
          top: var(--top);
          left: var(--left);
          width: 80px;
          height: 2px;
          background: linear-gradient(90deg, #ffffff, transparent);
          transform: rotate(-45deg);
          animation: shoot var(--speed) linear infinite;
          animation-delay: var(--delay);
          opacity: 0;
      }

      .cosmic-scan {
          position: fixed;
          inset: 0;
          z-index: -1;
          background: linear-gradient(to bottom, transparent, rgba(0, 255, 204, 0.02) 50%, transparent);
          background-size: 100% 300%;
          animation: scanMovement 10s linear infinite;
      }

      @keyframes planetFloat {
          0% { transform: translateY(0px) rotate(-15deg); }
          100% { transform: translateY(15px) rotate(-12deg); }
      }
      @keyframes auroraShift {
          0% { transform: scale(1) translate(0px, 0px); }
          100% { transform: scale(1.2) translate(30px, -20px); }
      }
      @keyframes twinkle {
          0% { opacity: 0.2; transform: scale(0.8); }
          100% { opacity: 1; transform: scale(1.2); }
      }
      @keyframes dustFloat {
          0% { background-position: 0 0, 150px 70px; }
          100% { background-position: 260px -520px, -340px 680px; }
      }
      @keyframes shoot {
          0% { transform: translate(0, 0) rotate(-45deg); opacity: 0; width: 0; }
          10% { opacity: 1; width: 80px; }
          20% { transform: translate(-200px, 200px) rotate(-45deg); opacity: 0; width: 0; }
          100% { transform: translate(-200px, 200px) rotate(-45deg); opacity: 0; }
      }
      @keyframes scanMovement {
          0% { background-position: 0% 0%; }
          100% { background-position: 0% 300%; }
      }

      .card { 
          background: rgba(4, 5, 12, 0.75); 
          backdrop-filter: blur(15px); 
          -webkit-backdrop-filter: blur(15px);
          border-radius: 40px; 
          box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 50px rgba(0, 255, 204, 0.15); 
          max-width: 500px; 
          width: 100%;
          padding: 45px 35px; 
          border: 1px solid rgba(255, 255, 255, 0.12);
          position: relative;
          z-index: 10;
          box-sizing: border-box;
      }

      h1 { 
          color: #fff; 
          margin-top: 0;
          margin-bottom: 25px; 
          font-size: 28px;
          text-shadow: 0 0 10px rgba(255, 255, 255, 0.6), 0 0 20px rgba(0, 255, 204, 0.3);
      } 
      p { font-size: 18px; line-height: 1.6; color: #cbd5e1; }
      strong { color: #00ffcc; text-shadow: 0 0 10px rgba(0, 255, 204, 0.5); }

      .btn { 
          display: inline-block; 
          background: transparent;
          color: #ff8c00; 
          padding: 14px 40px; 
          text-decoration: none; 
          border-radius: 16px; 
          margin-top: 35px; 
          font-weight: bold; 
          font-size: 16px;
          border: 2px solid #ff8c00;
          box-shadow: 0 0 15px rgba(255, 140, 0, 0.2);
          transition: all 0.3s ease;
          z-index: 10;
          position: relative;
      }
      .btn:hover { 
          background: #ff8c00; 
          color: #010206;
          transform: translateY(-4px);
          box-shadow: 0 0 35px rgba(255, 140, 0, 0.7);
      } 
      .btn:visited { color: #ff8c00; }
      .btn:hover:visited { color: #010206; }

      .neon-box {
          position: relative;
          width: 200px;
          height: 200px;
          margin: 25px auto;
          border-radius: 50% !important;
          overflow: hidden; 
          display: flex;
          justify-content: center;
          align-items: center;
          box-shadow: 0 0 30px rgba(0, 162, 255, 0.4);
      }

      .neon-box::before {
          content: '';
          position: absolute;
          width: 150%;
          height: 150%;
          background: conic-gradient(#ff0055, #00ffcc, #9900ff, #ff0055);
          animation: rotateRGB 3s linear infinite; 
      }

      .neon-box::after {
          content: '';
          position: absolute;
          inset: 5px; 
          background: #05050f;
          border-radius: 50% !important;
          z-index: 1;
      }

      .profile-effect {
          width: calc(100% - 10px);
          height: calc(100% - 10px);
          border-radius: 50% !important;
          object-fit: cover;
          z-index: 2; 
          transition: transform 0.3s ease;
      }

      .neon-box:hover .profile-effect {
          transform: scale(1.08) rotate(5deg); 
      }

      @keyframes rotateRGB {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
      }
  </style>
</head>
<body>

  <div class="space-aurora"></div>
  <div id="star-container"></div>
  <div class="space-dust"></div>
  <div class="cosmic-scan"></div>

  <div class="shooting-star-container">
      <div class="shooting-star" style="--top: 10%; --left: 80%; --speed: 5s; --delay: 0s;"></div>
      <div class="shooting-star" style="--top: 30%; --left: 90%; --speed: 7s; --delay: 2s;"></div>
      <div class="shooting-star" style="--top: 5%; --left: 40%; --speed: 6s; --delay: 4s;"></div>
      <div class="shooting-star" style="--top: 50%; --left: 95%; --speed: 8s; --delay: 1s;"></div>
  </div>

  <div class="giant-planet-container">
      <div class="planet-ring-back-shadow"></div> 
      <div class="planet-body"></div>             
      <div class="planet-ring"></div>             
  </div>

  <div class="card">
      <h1>ยินดีต้อนรับสู่โปรไฟล์ของฉัน </h1>

      <div class="neon-box">
        <img src="113596.jpg" class="profile-effect" alt="Profile">
      </div>

      <p>สวัสดีครับ! ผมชื่อ <strong>อิทธิพัทธ์ แจ่มจำรัส (Itthipat Jamjumras)</strong> ชั้น ม.6/3 เลขที่ 7</p>
      <p>ขณะนี้กำลังศึกษาอยู่สายการเรียน MSEP สนใจด้านรัฐศาสตร์และนิติศาสตร์</p>
      <p>นี่คือเว็บไซต์แรกของผมที่โฮสต์บน GitHub Pages!</p>
  </div>

   <div class=".btn">
        <a href="portfolio.html" class="btn"> หน้าแสดง Portfolio</a>
   </div>

  <script>
      function createRandomStars() {
          const container = document.getElementById('star-container');
          const starCount = 150;

          for (let i = 0; i < starCount; i++) {
              const star = document.createElement('div');
              star.classList.add('star');

              const size = Math.random() * 2 + 1;

              const posX = Math.random() * 100;
              const posY = Math.random() * 100;

              const duration = Math.random() * 3 + 2;
              const baseOpacity = Math.random() * 0.6 + 0.4;

              star.style.width = `${size}px`;
              star.style.height = `${size}px`;
              star.style.left = `${posX}%`;
              star.style.top = `${posY}%`;
              star.style.setProperty('--duration', `${duration}s`);
              star.style.setProperty('--base-opacity', baseOpacity);

              container.appendChild(star);
          }
      }

      document.addEventListener("DOMContentLoaded", createRandomStars);
  </script>

</body>
</html>
